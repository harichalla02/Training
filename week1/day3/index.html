<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
        }

        header {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 20px;
        }

        #products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: contain;
        }

        .price {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Fake Store</h1>
        <p>Explore our products</p>
    </header>

    <p id="status" style="text-align:center">Loading products...</p>
    <div id="products"></div>

    <script src="fetch_.then_.catch_3.js"></script>
</body>
</html>
